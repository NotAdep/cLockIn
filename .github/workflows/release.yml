name: Release

# Push a tag like v0.3.0 to build the DMG and publish a GitHub Release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" ./scripts/make-dmg.sh

      - name: Release notes from CHANGELOG.md
        run: |
          # The section under "## <version>", up to the next "## ".
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install
          Download **cLockIn-${{ env.VERSION }}.dmg**, open it and drag cLockIn into Applications.
          The first time, macOS may block it because it isn't from the App Store: open
          **System Settings → Privacy & Security** and click **Open Anyway**.
          EOF
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/cLockIn-$VERSION.dmg" "dist/cLockIn-$VERSION.dmg.sha256" \
            --title "cLockIn $VERSION" \
            --notes-file notes.md
